name: mindrush
description: "MindRush — Play smarter. Learn faster."
publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.2
  confetti: ^0.7.0
  
  # Storage & Networking
  shared_preferences: ^2.2.2
  http: ^1.1.0
  uuid: ^4.2.1
  
  # Ads & Monetization
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.1.13
  
  # Push Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/questions/questions.json
    - assets/images/mindrush_logo.png
    - assets/images/appstore.png
    - assets/images/playstore.png
