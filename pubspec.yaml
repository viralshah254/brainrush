name: mindrush
description: "MindRush — Play smarter. Learn faster."
publish_to: 'none'

version: 1.0.17+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Internationalization
  intl: ^0.20.2
  
  # UI
  cupertino_icons: ^1.0.2
  confetti: ^0.7.0
  
  # Storage & Networking
  shared_preferences: ^2.2.2
  http: ^1.1.0
  uuid: ^4.2.1
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^6.0.5
  
  # Ads & Monetization
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.1.13
  
  # Firebase & Authentication
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.2
  flutter_facebook_auth: ^7.1.1
  
  # Local Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2
  
  # Other
  url_launcher: ^6.2.2
  package_info_plus: ^8.0.0
  firebase_remote_config: ^5.1.3
  flutter_contacts: ^1.1.7
  permission_handler: ^11.3.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/questions/questions.json
    - assets/questions/education_questions.json
    - assets/images/mindrush_logo.png
    - assets/images/appstore.png
    - assets/images/playstore.png
